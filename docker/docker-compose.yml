services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bazi
      POSTGRES_USER: bazi
      POSTGRES_PASSWORD: bazi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazi -d bazi"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
